<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>📚 Student Task Manager</h1>
    <p>Plan your day. Complete your goals!</p>
    <button id="themeButton" onclick="toggleDarkMode()">🌙 Dark Mode</button>
</header>

<main class="container">

    <section class="dashboard">
        <div class="card">
            <h3>Total Tasks</h3>
            <p id="totalTasks">0</p>
        </div>
        <div class="card">
            <h3>Completed</h3>
            <p id="completedTasks">0</p>
        </div>
        <div class="card">
            <h3>Pending</h3>
            <p id="pendingTasks">0</p>
        </div>
    </section>

    <section class="task-form">
        <h2>➕ Add a Task</h2>

        <input type="text" id="taskInput" placeholder="Enter your task">

        <label for="dueDate">Due Date:</label>
        <input type="date" id="dueDate">

        <button id="addButton" onclick="addTask()">Add Task</button>
    </section>

    <section class="task-section">
        <h2>📋 My Tasks</h2>

        <input type="search" id="searchInput"
               placeholder="🔍 Search tasks..."
               oninput="displayTasks()">

        <div class="filters">
            <button onclick="setFilter('all')" class="filter-btn">All</button>
            <button onclick="setFilter('pending')" class="filter-btn">Pending</button>
            <button onclick="setFilter('completed')" class="filter-btn">Completed</button>
        </div>

        <h3>📊 Completion Progress</h3>
        <div class="progress-container">
            <div id="progressBar">0%</div>
        </div>

        <ul id="taskList"></ul>
        <p id="emptyMessage">No tasks found. Add a task to get started!</p>
    </section>

</main>

<footer>
    <p>Made with ❤️ by a BCA Student</p>
</footer>

<script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
    let editIndex = null;
    let currentFilter = "all";

    function saveTasks() {
        localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function updateDashboard() {
        const completed = tasks.filter(task => task.completed).length;
        const pending = tasks.length - completed;
        const percentage = tasks.length
            ? Math.round((completed / tasks.length) * 100)
            : 0;

        document.getElementById("totalTasks").textContent = tasks.length;
        document.getElementById("completedTasks").textContent = completed;
        document.getElementById("pendingTasks").textContent = pending;

        const progressBar = document.getElementById("progressBar");
        progressBar.style.width = percentage + "%";
        progressBar.textContent = percentage + "%";
    }

    function displayTasks() {
        const list = document.getElementById("taskList");
        const search = document.getElementById("searchInput")
            .value.toLowerCase().trim();

        list.innerHTML = "";

        const visibleTasks = tasks
            .map((task, index) => ({ task, index }))
            .filter(item => {
                const matchesSearch =
                    item.task.text.toLowerCase().includes(search);

                const matchesFilter =
                    currentFilter === "all" ||
                    (currentFilter === "pending" && !item.task.completed) ||
                    (currentFilter === "completed" && item.task.completed);

                return matchesSearch && matchesFilter;
            });

        document.getElementById("emptyMessage").style.display =
            visibleTasks.length === 0 ? "block" : "none";

        visibleTasks.forEach(({ task, index }) => {
            const li = document.createElement("li");
            li.className = task.completed ? "task-item completed" : "task-item";

            const details = document.createElement("div");
            details.className = "task-details";

            const name = document.createElement("span");
            name.className = "task-name";
            name.textContent = task.text;

            const date = document.createElement("small");
            date.textContent = task.dueDate
                ? "📅 Due: " + task.dueDate
                : "📅 No due date";

            details.append(name, date);

            const buttons = document.createElement("div");
            buttons.className = "task-buttons";

            const complete = document.createElement("button");
            complete.textContent = task.completed ? "↩️ Undo" : "✅ Complete";
            complete.className = "complete-btn";
            complete.onclick = () => {
                tasks[index].completed = !tasks[index].completed;
                saveTasks();
                displayTasks();
            };

            const edit = document.createElement("button");
            edit.textContent = "✏️ Edit";
            edit.className = "edit-btn";
            edit.onclick = () => {
                document.getElementById("taskInput").value = task.text;
                document.getElementById("dueDate").value = task.dueDate || "";
                document.getElementById("addButton").textContent = "Save Changes";
                editIndex = index;
                document.getElementById("taskInput").focus();
                document.querySelector(".task-form").scrollIntoView({
                    behavior: "smooth"
                });
            };

            const del = document.createElement("button");
            del.textContent = "🗑️ Delete";
            del.className = "delete-btn";
            del.onclick = () => {
                tasks.splice(index, 1);

                if (editIndex === index) {
                    resetForm();
                } else if (editIndex !== null && editIndex > index) {
                    editIndex--;
                }

                saveTasks();
                displayTasks();
            };

            buttons.append(complete, edit, del);
            li.append(details, buttons);
            list.appendChild(li);
        });

        updateDashboard();
    }

    function addTask() {
        const input = document.getElementById("taskInput");
        const date = document.getElementById("dueDate");
        const text = input.value.trim();

        if (!text) {
            alert("Please enter a task!");
            input.focus();
            return;
        }

        if (editIndex !== null) {
            tasks[editIndex].text = text;
            tasks[editIndex].dueDate = date.value;
            editIndex = null;
        } else {
            tasks.push({
                text: text,
                dueDate: date.value,
                completed: false
            });
        }

        saveTasks();
        resetForm();
        displayTasks();
    }

    function resetForm() {
        document.getElementById("taskInput").value = "";
        document.getElementById("dueDate").value = "";
        document.getElementById("addButton").textContent = "Add Task";
        editIndex = null;
    }

    function setFilter(filter) {
        currentFilter = filter;
        displayTasks();
    }

    function toggleDarkMode() {
        document.body.classList.toggle("dark-mode");

        const isDark = document.body.classList.contains("dark-mode");

        localStorage.setItem("darkMode", isDark);

        document.getElementById("themeButton").textContent =
            isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
    }

    if (localStorage.getItem("darkMode") === "true") {
        document.body.classList.add("dark-mode");
        document.getElementById("themeButton").textContent = "☀️ Light Mode";
    }

    document.getElementById("taskInput").addEventListener("keydown", event => {
        if (event.key === "Enter") addTask();
    });

    displayTasks();
</script>

</body>
</html>
