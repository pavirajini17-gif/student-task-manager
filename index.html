<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>📚 Student Task Manager</h1>
        <p>Plan your day. Complete your goals. Celebrate your progress!</p>
    </header>

    <main class="container">

        <section class="dashboard">
            <div class="card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>
        </section>

        <section class="task-form">
            <h2>➕ Add a New Task</h2>

            <input type="text" id="taskInput" placeholder="What do you need to do?">

            <label for="dueDate">Due date:</label>
            <input type="date" id="dueDate">

            <button id="addButton" onclick="addTask()">Add Task</button>
        </section>

        <section class="task-section">
            <h2>📝 My Tasks</h2>

            <ul id="taskList"></ul>

            <p id="emptyMessage">No tasks yet. Add your first task! 🌟</p>
        </section>

    </main>

    <footer>
        <p>Made with ❤️ by a BCA Student</p>
    </footer>

    <script>
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
        let editIndex = null;

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function updateDashboard() {
            const completed = tasks.filter(task => task.completed).length;

            document.getElementById("totalTasks").textContent = tasks.length;
            document.getElementById("completedTasks").textContent = completed;
            document.getElementById("pendingTasks").textContent =
                tasks.length - completed;
        }

        function displayTasks() {
            const taskList = document.getElementById("taskList");
            const emptyMessage = document.getElementById("emptyMessage");

            taskList.innerHTML = "";

            emptyMessage.style.display = tasks.length === 0 ? "block" : "none";

            tasks.forEach(function(task, index) {
                const li = document.createElement("li");
                li.className = task.completed ? "task-item completed" : "task-item";

                const details = document.createElement("div");
                details.className = "task-details";

                const taskText = document.createElement("span");
                taskText.className = "task-name";
                taskText.textContent = task.text;

                const dateText = document.createElement("small");
                dateText.textContent = task.dueDate
                    ? "📅 Due: " + task.dueDate
                    : "📅 No due date";

                details.appendChild(taskText);
                details.appendChild(dateText);

                const buttons = document.createElement("div");
                buttons.className = "task-buttons";

                const completeButton = document.createElement("button");
                completeButton.textContent = task.completed ? "↩️ Undo" : "✅ Complete";
                completeButton.className = "complete-btn";

                completeButton.onclick = function() {
                    tasks[index].completed = !tasks[index].completed;
                    saveTasks();
                    displayTasks();
                };

                const editButton = document.createElement("button");
                editButton.textContent = "✏️ Edit";
                editButton.className = "edit-btn";

                editButton.onclick = function() {
                    document.getElementById("taskInput").value = task.text;
                    document.getElementById("dueDate").value = task.dueDate || "";
                    document.getElementById("addButton").textContent = "Save Changes";
                    editIndex = index;

                    document.getElementById("taskInput").focus();
                    document.querySelector(".task-form").scrollIntoView({
                        behavior: "smooth"
                    });
                };

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "🗑️ Delete";
                deleteButton.className = "delete-btn";

                deleteButton.onclick = function() {
                    tasks.splice(index, 1);

                    if (editIndex === index) {
                        resetForm();
                    } else if (editIndex !== null && editIndex > index) {
                        editIndex--;
                    }

                    saveTasks();
                    displayTasks();
                };

                buttons.appendChild(completeButton);
                buttons.appendChild(editButton);
                buttons.appendChild(deleteButton);

                li.appendChild(details);
                li.appendChild(buttons);

                taskList.appendChild(li);
            });

            updateDashboard();
        }

        function addTask() {
            const input = document.getElementById("taskInput");
            const dateInput = document.getElementById("dueDate");
            const text = input.value.trim();
            const dueDate = dateInput.value;

            if (text === "") {
                alert("Please enter a task!");
                input.focus();
                return;
            }

            if (editIndex !== null) {
                tasks[editIndex].text = text;
                tasks[editIndex].dueDate = dueDate;
                editIndex = null;
            } else {
                tasks.push({
                    text: text,
                    dueDate: dueDate,
                    completed: false
                });
            }

            saveTasks();
            resetForm();
            displayTasks();
        }

        function resetForm() {
            document.getElementById("taskInput").value = "";
            document.getElementById("dueDate").value = "";
            document.getElementById("addButton").textContent = "Add Task";
            editIndex = null;
        }

        document.getElementById("taskInput").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        });

        displayTasks();
    </script>
</body>
</html>
